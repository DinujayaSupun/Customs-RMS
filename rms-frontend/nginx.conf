server {
    listen 80;
    server_name _;

    # Where the built Vue files live inside the container
    root /usr/share/nginx/html;
    index index.html;

    # SPA fallback. Your app uses vue-router in "history" mode, so URLs like
    # /documents/5 are handled by JavaScript in the browser, not by real files
    # on disk. Without this, refreshing such a page would give a 404.
    # try_files says: if the requested file/folder doesn't exist, serve
    # index.html and let vue-router take over.
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Let the browser cache compiled JS/CSS aggressively (they have hashed
    # filenames, so a new build = a new name = no stale cache problems).
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }
}
