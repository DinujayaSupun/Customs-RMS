# Production profile overrides.
# Activate with: SPRING_PROFILES_ACTIVE=prod
# All secrets must be supplied via environment variables — no defaults are provided here.

# Prevent Hibernate from auto-altering the schema in production. Flyway (inherited from the base
# config, enabled=true) applies the versioned migrations on startup; Hibernate then only validates.
# On a fresh production database Flyway runs V1; on a pre-existing one it baselines at V1.
spring.jpa.hibernate.ddl-auto=validate

# JWT expiration: set JWT_EXPIRATION_MS env var to override (default 8 h = 28800000 ms)

# Disable seeding in production.
app.seed.enabled=false
app.seed.default-password=
app.seed.admin-password=

# CORS / WebSocket allowed origins: MUST be set to the real frontend domain(s) in production.
# Without this it falls back to localhost and both API calls and real-time notifications will be
# blocked. Comma-separated, e.g. APP_CORS_ALLOWED_ORIGINS=https://rms.customs.gov.lk
app.cors.allowed-origins=${APP_CORS_ALLOWED_ORIGINS:http://localhost:5173}

# Keep SQL logging off in production.
spring.jpa.show-sql=false
logging.level.org.hibernate.SQL=WARN
logging.level.org.hibernate.orm.jdbc.bind=WARN
