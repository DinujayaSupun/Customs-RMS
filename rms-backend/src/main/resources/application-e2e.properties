server.port=${SERVER_PORT:8081}

spring.datasource.url=jdbc:mysql://localhost:3306/customs_rms_e2e?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC
spring.datasource.username=${E2E_DB_USERNAME:${DB_USERNAME:root}}
spring.datasource.password=${E2E_DB_PASSWORD:${DB_PASSWORD}}
app.jwt.secret=${JWT_SECRET:MDEyMzQ1Njc4OWFiY2RlZjAxMjM0NTY3ODlhYmNkZWY=}

# create-drop rebuilds the e2e schema on every boot, so a persistent local MySQL behaves like CI's
# fresh container: seeded users (admin/dc/...) always get the expected passwords. The seeder only
# creates users that don't already exist, so a stale e2e DB would otherwise keep old credentials and
# fail every login. The dedicated customs_rms_e2e schema is disposable; this never touches dev data.
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=false

spring.task.scheduling.enabled=false

# Disable the per-IP login throttle during e2e: the suite logs in many times from one IP, so a setup
# problem should surface as its real error (e.g. 400) instead of being masked by a 429 brute-force block.
app.login.max-failed-attempts=1000000

app.upload-dir=./target/e2e-uploads

app.seed.enabled=true
app.seed.default-password=${APP_SEED_DEFAULT_PASSWORD}
app.seed.admin-password=${APP_SEED_ADMIN_PASSWORD}

app.cors.allowed-origins=http://localhost:4173,http://localhost:5173
