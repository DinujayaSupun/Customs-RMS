spring.application.name=rms-backend

server.port=8080

spring.datasource.url=jdbc:mysql://localhost:3306/customs_rms?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=false
logging.level.org.hibernate.SQL=WARN
logging.level.org.hibernate.orm.jdbc.bind=WARN

# Upload settings (✅ external folder recommended)
# Windows example:
app.upload-dir=${APP_UPLOAD_DIR:C:/customs_uploads}

spring.servlet.multipart.enabled=true
spring.servlet.multipart.max-file-size=25MB
spring.servlet.multipart.max-request-size=25MB

# JWT settings
app.jwt.secret=${JWT_SECRET}
app.jwt.expiration-ms=28800000

app.seed.default-users.enabled=${SEED_DEFAULT_USERS_ENABLED:false}
app.seed.default-users.password=${SEED_DEFAULT_USERS_PASSWORD:}
app.seed.default-users.admin-password=${SEED_DEFAULT_USERS_ADMIN_PASSWORD:}

app.dc-auto-forward.poll-ms=${DC_AUTO_FORWARD_POLL_MS:60000}
