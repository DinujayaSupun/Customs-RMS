spring.application.name=rms-backend

server.port=8080

spring.datasource.url=jdbc:mysql://localhost:3306/customs_rms?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=false
spring.jpa.open-in-view=false
logging.level.org.hibernate.SQL=WARN
logging.level.org.hibernate.orm.jdbc.bind=WARN

spring.datasource.hikari.maximum-pool-size=20
spring.datasource.hikari.minimum-idle=5
spring.datasource.hikari.connection-timeout=30000
spring.datasource.hikari.idle-timeout=600000
spring.datasource.hikari.max-lifetime=1800000

# Upload settings (external folder recommended)
# Windows example:
app.upload-dir=${APP_UPLOAD_DIR:C:/customs_uploads}

spring.servlet.multipart.enabled=true
spring.servlet.multipart.max-file-size=25MB
spring.servlet.multipart.max-request-size=25MB

# JWT settings
app.jwt.secret=${JWT_SECRET}
app.jwt.expiration-ms=${JWT_EXPIRATION_MS:28800000}

app.dc-auto-forward.poll-ms=${DC_AUTO_FORWARD_POLL_MS:60000}

# CORS: comma-separated allowed origins; override in production via env var or application-prod.properties
app.cors.allowed-origins=${APP_CORS_ALLOWED_ORIGINS:http://localhost:5173,http://localhost:3000,http://localhost:4000}

# Seed defaults are disabled by default and should be enabled only for local/dev profile usage.
app.seed.enabled=${APP_SEED_ENABLED:false}
app.seed.default-password=${APP_SEED_DEFAULT_PASSWORD:}
app.seed.admin-password=${APP_SEED_ADMIN_PASSWORD:}
