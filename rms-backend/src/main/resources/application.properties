spring.application.name=rms-backend

server.port=8080

# DB connection. Override the whole URL via DB_URL to target another engine (driver + dialect are
# auto-detected from the URL); the default below keeps local/dev on MySQL unchanged.
spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/customs_rms?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC}
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}

# Flyway owns the schema now (versioned scripts in db/migration). Hibernate only VALIDATES that
# the entities match the migrated schema — it no longer alters tables (that caused the @Version
# NULL-column bug). baseline-on-migrate lets a pre-existing database adopt Flyway by marking V1 as
# the baseline instead of re-running it; a fresh database simply runs V1.
spring.jpa.hibernate.ddl-auto=validate
spring.flyway.enabled=true
spring.flyway.baseline-on-migrate=true
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=false
spring.jpa.open-in-view=false
logging.level.org.hibernate.SQL=WARN
logging.level.org.hibernate.orm.jdbc.bind=WARN

# Keep a rolling log file so backend errors are visible without the terminal.
logging.file.name=rms-backend.log
logging.logback.rollingpolicy.max-file-size=10MB
logging.logback.rollingpolicy.max-history=3

spring.datasource.hikari.maximum-pool-size=20
spring.datasource.hikari.minimum-idle=5
spring.datasource.hikari.connection-timeout=30000
spring.datasource.hikari.idle-timeout=600000
spring.datasource.hikari.max-lifetime=1800000

# Upload settings (external folder recommended)
# Windows example:
app.upload-dir=${APP_UPLOAD_DIR:C:/customs_uploads}

spring.servlet.multipart.enabled=true
spring.servlet.multipart.max-file-size=25MB
spring.servlet.multipart.max-request-size=25MB

# JWT settings
app.jwt.secret=${JWT_SECRET}
app.jwt.expiration-ms=${JWT_EXPIRATION_MS:28800000}

# Login brute-force throttle (application-layer, per client IP). Block the source once it exceeds
# the failed-attempt count within the window; a successful login clears its counter.
app.login.max-failed-attempts=${LOGIN_MAX_FAILED_ATTEMPTS:10}
app.login.block-minutes=${LOGIN_BLOCK_MINUTES:15}

app.dc-auto-forward.poll-ms=${DC_AUTO_FORWARD_POLL_MS:60000}

# CORS: comma-separated allowed origins; override in production via env var or application-prod.properties
app.cors.allowed-origins=${APP_CORS_ALLOWED_ORIGINS:http://localhost:5173,http://localhost:3000,http://localhost:4000}

# Seed defaults are disabled by default and should be enabled only for local/dev profile usage.
app.seed.enabled=${APP_SEED_ENABLED:false}
app.seed.default-password=${APP_SEED_DEFAULT_PASSWORD:}
app.seed.admin-password=${APP_SEED_ADMIN_PASSWORD:}
