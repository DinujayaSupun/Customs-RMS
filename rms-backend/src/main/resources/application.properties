spring.application.name=rms-backend

server.port=8080

spring.datasource.url=jdbc:mysql://localhost:3306/customs_rms?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD:root123}

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=false
logging.level.org.hibernate.SQL=WARN
logging.level.org.hibernate.orm.jdbc.bind=WARN

# Upload settings (✅ external folder recommended)
# Windows example:
app.upload-dir=${APP_UPLOAD_DIR:C:/customs_uploads}

spring.servlet.multipart.enabled=true
spring.servlet.multipart.max-file-size=25MB
spring.servlet.multipart.max-request-size=25MB

# JWT settings
app.jwt.secret=${JWT_SECRET:cW1TNXUxM0xURnRjWnJmU3BsaDl6Z3VweFY4QnQ4V3hNQ3I1S1V0VXA9}
app.jwt.expiration-ms=28800000

app.dc-auto-forward.poll-ms=${DC_AUTO_FORWARD_POLL_MS:60000}

# Seed defaults are disabled by default and should be enabled only for local/dev profile usage.
app.seed.enabled=false
