name: CI

on:
  push:
    branches:
      - "**"
  pull_request:

jobs:
  backend-tests:
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: rms-backend

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: maven

      - name: Run backend tests
        run: mvn test

  frontend-e2e-smoke:
    runs-on: ubuntu-latest
    needs: backend-tests
    env:
      DB_USERNAME: root
      DB_PASSWORD: ci_only_db_password
      JWT_SECRET: Y2lfdGVzdF9qd3Rfc2VjcmV0XzEyMzQ1Njc4OTBfMTIzNDU2Nzg5MF8xMjM0NTY3ODkwXzEyMzQ1Njc4OTA=
      SPRING_PROFILES_ACTIVE: e2e
      SERVER_PORT: 8081
      APP_SEED_ENABLED: "true"
      APP_SEED_DEFAULT_PASSWORD: CiWorkflowPass123!
      APP_SEED_ADMIN_PASSWORD: CiWorkflowAdmin123!
      RMS_E2E_API_BASE_URL: http://localhost:8081/api
      RMS_E2E_ADMIN_USER: admin
      RMS_E2E_ADMIN_PASS: CiWorkflowAdmin123!
      RMS_E2E_DC_USER: dc
      RMS_E2E_DC_PASS: CiWorkflowPass123!
    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: ci_only_db_password
          MYSQL_DATABASE: customs_rms
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h localhost -pci_only_db_password"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=10

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: maven

      - name: Set up Node 20
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: rms-frontend/package-lock.json

      - name: Install backend dependencies
        working-directory: rms-backend
        run: mvn -q -DskipTests clean install

      - name: Start backend
        working-directory: rms-backend
        run: |
          mvn spring-boot:run > backend-ci.log 2>&1 &
          echo $! > backend.pid

      - name: Wait for backend health
        working-directory: rms-backend
        run: |
          for i in {1..60}; do
            if curl -fsS http://localhost:8081/api/health > /dev/null; then
              exit 0
            fi
            sleep 2
          done
          echo "Backend did not become healthy"
          tail -n 200 backend-ci.log || true
          exit 1

      - name: Install frontend dependencies
        working-directory: rms-frontend
        run: npm ci

      - name: Run frontend unit tests
        working-directory: rms-frontend
        run: npm run test:unit

      - name: Install Playwright browser
        working-directory: rms-frontend
        run: npx playwright install --with-deps chromium

      - name: Run frontend smoke E2E
        working-directory: rms-frontend
        run: npm run test:e2e

      - name: Upload Playwright report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: |
            rms-frontend/playwright-report
            rms-frontend/test-results
          if-no-files-found: ignore

      - name: Upload backend CI log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: backend-ci-log
          path: rms-backend/backend-ci.log
          if-no-files-found: ignore

      - name: Stop backend
        if: always()
        working-directory: rms-backend
        run: |
          if [ -f backend.pid ]; then
            kill "$(cat backend.pid)" || true
          fi
